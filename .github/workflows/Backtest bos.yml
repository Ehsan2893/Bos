name: Strategy 6 Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Binance symbol, e.g. BTC/USDT or ETH/USDT"
        required: true
        default: "BTC/USDT"
      timeframe:
        description: "Execution timeframe"
        type: choice
        options:
          - 5m
          - 15m
          - 1h
        required: true
        default: "5m"
      days:
        description: "History length in days"
        required: true
        default: "90"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          SYMBOL: ${{ inputs.symbol }}
          TIMEFRAME: ${{ inputs.timeframe }}
          DAYS: ${{ inputs.days }}
          INITIAL_EQUITY: "1000"
          RISK_PCT: "0.5"
          RR: "2.0"
          FEE_RATE: "0.001"
          SLIPPAGE_RATE: "0.0005"
        run: python strategy6_bos_liquidity.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy6-backtest-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
