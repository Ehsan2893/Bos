name: Crypto Strategy Backtest

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
backtest:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Show repository files
    run: |
      echo "Current directory:"
      pwd
      echo "Repository files:"
      ls -la
      echo "Python files:"
      find . -type f -name "*.py"
      echo "Dependency files:"
      find . -type f -name "requirements.txt" -o -name "pyproject.toml"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip

      if [ -f requirements.txt ]; then
        python -m pip install -r requirements.txt
      elif [ -f pyproject.toml ]; then
        python -m pip install .
      else
        python -m pip install pandas numpy ccxt matplotlib pytest
      fi

  - name: Run Python backtest
    run: |
      set -e

      if [ -f backtest.py ]; then
        python backtest.py
      else
        echo "ERROR: backtest.py was not found in the repository root."
        echo "Check the file list in the previous step."
        exit 1
      fi
